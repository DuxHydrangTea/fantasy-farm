<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art 4-Depth Color Ramp Generator</title>
  <style>
    :root {
      --bg: #141619;
      --card: #1e2227;
      --text: #f0f3f6;
      --text-muted: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px;
    }
    .container { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 24px; }
    header { text-align: center; }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; }
    .input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
    }
    .input-row label { font-size: 0.95rem; font-weight: 500; }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 8px; }
    input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-family: monospace;
      width: 110px;
      text-transform: uppercase;
      text-align: center;
    }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; }
    .preset-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .preset-btn:hover { border-color: #58a6ff; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .color-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .color-preview {
      height: 180px;
      width: 100%;
      transition: background-color 0.15s ease;
    }
    .color-info {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tier-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .hex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hex-code {
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .copy-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .copy-btn:hover { background: #30363d; border-color: #8b949e; }
    .copy-btn.copied { background: #238636; border-color: #2ea043; color: #fff; }
    .stacked-bar {
      display: flex;
      height: 44px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }
    .stacked-segment { flex: 1; transition: background-color 0.15s; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Pixel Art 4-Depth Color Ramp</h1>
      <p class="subtitle">Hue-shifting gradient formula: Highlight, Base, Shadow &amp; Deep Outline</p>
    </header>

    <div class="input-row">
      <label for="picker">Chọn màu Base:</label>
      <input type="color" id="picker" value="#AD683B">
      <input type="text" id="hexInput" value="#AD683B" maxlength="7">
      <div class="presets">
        <button class="preset-btn" data-color="#AD683B">Đất (#AD683B)</button>
        <button class="preset-btn" data-color="#47B339">Cỏ (#47B339)</button>
        <button class="preset-btn" data-color="#8C5835">Gỗ (#8C5835)</button>
        <button class="preset-btn" data-color="#3A82C4">Nước (#3A82C4)</button>
        <button class="preset-btn" data-color="#7B8B99">Đá (#7B8B99)</button>
      </div>
    </div>

    <!-- Thanh hiển thị màu xếp chồng liên tục (Dải chuyển tiếp trực quan) -->
    <div class="stacked-bar">
      <div class="stacked-segment" id="bar0"></div>
      <div class="stacked-segment" id="bar1"></div>
      <div class="stacked-segment" id="bar2"></div>
      <div class="stacked-segment" id="bar3"></div>
    </div>

    <!-- 4 Khối màu chi tiết -->
    <div class="grid" id="cardsGrid"></div>
  </div>

  <script>
    const TIERS = [
      { name: "1. Highlight", desc: "Đón nắng (+18% V, -8% S, shift vàng)", dh: 10, targetH: 60, ds: -0.08, dv: 0.18 },
      { name: "2. Base", desc: "Màu gốc chủ đạo", dh: 0, targetH: 0, ds: 0, dv: 0 },
      { name: "3. Shadow", desc: "Bóng tối (-22% V, +12% S, shift lạnh)", dh: 15, targetH: 240, ds: 0.12, dv: -0.22 },
      { name: "4. Deep Outline", desc: "Viền chìm / Đáy (-45% V, +6% S, shift tối)", dh: 22, targetH: 240, ds: 0.06, dv: -0.45 }
    ];

    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      return isNaN(num) ? [173, 104, 59] : [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
      }
      return [h, max === 0 ? 0 : d / max, max];
    }

    function hsvToHex(h, s, v) {
      s = Math.max(0, Math.min(1, s));
      v = Math.max(0, Math.min(1, v));
      h = (h % 360 + 360) % 360;
      const f = n => {
        const k = (n + h / 60) % 6;
        return v - v * s * Math.max(Math.min(k, 4 - k, 1), 0);
      };
      const toHex = x => Math.round(x * 255).toString(16).padStart(2, '0');
      return `#${toHex(f(5))}${toHex(f(3))}${toHex(f(1))}`.toUpperCase();
    }

    function shiftToward(currentH, targetH, maxStep) {
      if (maxStep === 0) return 0;
      const diff = ((targetH - currentH + 540) % 360) - 180;
      return Math.sign(diff) * Math.min(Math.abs(diff), maxStep);
    }

    function generateRamp(baseHex) {
      const [r, g, b] = hexToRgb(baseHex);
      const [h, s, v] = rgbToHsv(r, g, b);
      return TIERS.map(t => {
        const shiftedH = h + shiftToward(h, t.targetH, t.dh);
        return hsvToHex(shiftedH, s + t.ds, v + t.dv);
      });
    }

    const picker = document.getElementById('picker');
    const hexInput = document.getElementById('hexInput');
    const cardsGrid = document.getElementById('cardsGrid');

    function render(baseHex) {
      const colors = generateRamp(baseHex);

      // Cập nhật thanh dải màu
      colors.forEach((col, idx) => {
        document.getElementById(`bar${idx}`).style.backgroundColor = col;
      });

      // Tạo các card màu
      cardsGrid.innerHTML = colors.map((col, idx) => `
        <div class="color-card">
          <div class="color-preview" style="background-color: ${col}"></div>
          <div class="color-info">
            <div>
              <div class="tier-title">${TIERS[idx].name}</div>
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">${TIERS[idx].desc}</div>
            </div>
            <div class="hex-row">
              <span class="hex-code">${col}</span>
              <button class="copy-btn" onclick="copyHex('${col}', this)">Copy</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function copyHex(hex, btn) {
      navigator.clipboard.writeText(hex).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Đã chép!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');
        }, 1200);
      });
    }

    function syncColor(val) {
      if (!val.startsWith('#')) val = '#' + val;
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        picker.value = val;
        hexInput.value = val.toUpperCase();
        render(val);
      }
    }

    picker.addEventListener('input', e => {
      hexInput.value = e.target.value.toUpperCase();
      render(e.target.value);
    });

    hexInput.addEventListener('input', e => {
      syncColor(e.target.value);
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const color = btn.getAttribute('data-color');
        picker.value = color;
        hexInput.value = color.toUpperCase();
        render(color);
      });
    });

    // Khởi chạy mặc định
    render(picker.value);
  </script>
</body>
</html>

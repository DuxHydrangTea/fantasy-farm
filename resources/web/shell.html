<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#safe-area-probe {
	position: fixed;
	visibility: hidden;
	pointer-events: none;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#rotate-notice {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 100;
	background: #172d26;
	color: #f5e3b8;
	font: 20px/1.5 system-ui, sans-serif;
	text-align: center;
	padding: 24px;
	box-sizing: border-box;
	align-items: center;
	justify-content: center;
	flex-direction: column;
}
#rotate-notice strong { font-size: 26px; }
#rotate-notice .turn { font-size: 64px; }
#rotate-notice [lang="vi"] { display: none; }
html:lang(vi) #rotate-notice [lang="en"] { display: none; }
html:lang(vi) #rotate-notice [lang="vi"] { display: block; }
@media (orientation: portrait) {
	html[data-touch="true"] #rotate-notice { display: flex; }
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<div id="safe-area-probe" aria-hidden="true"></div>
		<div id="rotate-notice" role="status" aria-live="polite">
			<span class="turn" aria-hidden="true">↻</span>
			<strong lang="en">Rotate your phone</strong>
			<strong lang="vi">Xoay ngang điện thoại</strong>
			<p lang="en">Play Fantasy Farm in landscape.<br>Your farm keeps growing while you rotate.</p>
			<p lang="vi">Chơi Fantasy Farm ở chế độ ngang.<br>Nông trại vẫn phát triển khi bạn xoay máy.</p>
		</div>
		<script>
		(() => {
			const params = new URLSearchParams(location.search);
			const forcedTouch = params.get('layout') === 'touch';
			const touch = () => forcedTouch || matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
			const update = () => document.documentElement.dataset.touch = String(touch());
			update();
			addEventListener('resize', update);
			matchMedia('(pointer: coarse)').addEventListener('change', update);
			window.FarmScreen = {
				metrics() {
					const canvas = document.getElementById('canvas');
					const rect = canvas.getBoundingClientRect();
					const style = getComputedStyle(document.getElementById('safe-area-probe'));
					let safe = [style.paddingLeft, style.paddingTop, style.paddingRight, style.paddingBottom].map(v => parseFloat(v) || 0);
					// Explicit layout preview only; never replace actual device insets by default.
					if (forcedTouch && params.has('safe')) {
						const requested = params.get('safe').split(',').map(Number);
						if (requested.length === 4 && requested.every(Number.isFinite)) safe = requested.map(v => Math.max(0, Math.min(v, Math.min(rect.width, rect.height) / 4)));
					}
					return {touch: touch(), pixel_ratio: rect.width > 0 ? canvas.width / rect.width : devicePixelRatio, safe};
				}
			};
		})();
		</script>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
